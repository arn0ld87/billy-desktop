name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift-Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Tests
        run: swift test

      - name: App bauen
        run: ./scripts/build-app.sh

      - name: Selbsttest (App starten, „Frag Billy“ öffnen)
        timeout-minutes: 2
        run: '"build/Billy Desktop.app/Contents/MacOS/BillyDesktop" --selftest'

      - name: App packen
        run: ditto -c -k --keepParent "build/Billy Desktop.app" build/Billy-Desktop.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Billy-Desktop
          path: build/Billy-Desktop.zip

  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Sprites sind reproduzierbar
        run: |
          python3 tools/sprites/generate_sprites.py
          python3 - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("Resources/Sprites/sprites.json").read_text())
          assert "stand" in meta["animations"] and "walk" in meta["animations"]
          PY
          git diff --stat --exit-code -- Resources/Sprites/sprites.json
